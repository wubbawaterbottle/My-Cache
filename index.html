<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>The Cache</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f3ef; --bg2: #ffffff; --bg3: #eae7e2;
  --border: #ddd9d3; --border2: #ccc8c1;
  --text: #2d2b28; --text2: #3d3b38; --text3: #1a1816;
  --dim: #8a857e; --dim2: #9e9990; --dim3: #b5b0a8;
  --amber: #c4882a; --amber2: #b07a24;
  --blue: #4a7fa8; --purple: #7b6eb0; --green: #5a7a4a;
  --red: #b04040; --redborder: #e0c0c0;
  --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
  --serif: 'EB Garamond', Georgia, serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--serif); min-height:100vh; -webkit-font-smoothing:antialiased; }

/* === NAV TABS (Tasks / Notes) === */
.nav-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:0; }
.nav-tab { flex:1; padding:12px; text-align:center; font-size:14px; font-family:var(--serif); color:var(--dim); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; background:transparent; border-top:none; border-left:none; border-right:none; }
.nav-tab.active { color:var(--amber); border-bottom-color:var(--amber); }

.container { max-width:900px; margin:0 auto; padding:20px 16px; }
.header { margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:14px; }
.header-top { display:flex; justify-content:space-between; align-items:baseline; }
.title { font-size:26px; font-weight:400; letter-spacing:6px; color:var(--text3); }
.header-right { display:flex; align-items:baseline; gap:12px; }
.save-status { font-size:11px; font-family:var(--mono); transition:opacity 0.3s; }
.save-ok { color:var(--green); } .save-err { color:var(--red); }
.count { font-size:13px; color:var(--dim); font-family:var(--mono); }
.subtitle { font-size:14px; color:var(--dim); margin-top:6px; }

.mode-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.mode-btn { display:flex; align-items:center; gap:4px; padding:8px 14px; border-radius:6px; border:1px solid var(--border2); background:transparent; cursor:pointer; font-size:13px; font-family:var(--serif); color:var(--dim); transition:all 0.2s; }
.mode-icon { font-size:16px; margin-right:4px; }

.cat-bar { display:flex; gap:2px; margin-bottom:12px; flex-wrap:wrap; border-bottom:1px solid var(--border); padding-bottom:2px; }
.cat-btn { background:transparent; border:none; cursor:pointer; font-size:12px; padding:4px 10px; font-family:var(--mono); color:var(--dim2); transition:all 0.15s; border-bottom:1px solid transparent; }
.cat-btn.active { color:var(--text); border-bottom-color:var(--text); }

.top-bar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.btn-add { background:var(--border); border:1px solid var(--border2); color:var(--text); padding:8px 16px; border-radius:6px; font-size:13px; cursor:pointer; font-family:var(--serif); }
.btn-done { background:transparent; border:1px solid var(--border); color:var(--dim2); padding:8px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-family:var(--mono); }
.btn-cat { background:transparent; border:1px solid var(--border); color:var(--dim2); padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-family:var(--mono); }

.panel { background:var(--bg2); border:1px solid var(--border2); border-radius:8px; padding:16px; margin-bottom:16px; }
.input { width:100%; background:var(--bg); border:1px solid var(--border2); color:var(--text2); padding:10px 12px; border-radius:6px; font-size:15px; font-family:var(--serif); margin-bottom:10px; outline:none; box-sizing:border-box; }
.form-row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.form-row-sliders { display:flex; gap:12px; margin-bottom:10px; flex-wrap:wrap; width:100%; }
.select { background:var(--bg); border:1px solid var(--border2); color:var(--text); padding:6px 10px; border-radius:4px; font-size:12px; font-family:var(--mono); }
.slider-label { font-size:13px; color:var(--dim); font-family:var(--mono); display:flex; flex-direction:column; gap:4px; flex:1; min-width:140px; }
.slider { -webkit-appearance:none; appearance:none; width:100%; height:8px; background:var(--border2); border-radius:4px; outline:none; cursor:pointer; margin:8px 0; touch-action:none; }
.slider::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:28px; height:28px; border-radius:50%; background:var(--amber); cursor:pointer; border:2px solid var(--bg2); box-shadow:0 1px 4px rgba(0,0,0,0.15); }
.slider::-moz-range-track { height:8px; background:var(--border); border-radius:4px; border:none; }
.slider::-moz-range-thumb { width:28px; height:28px; border-radius:50%; background:var(--amber); cursor:pointer; border:2px solid var(--bg2); box-shadow:0 1px 4px rgba(0,0,0,0.15); }
.slider:active::-webkit-slider-thumb { transform:scale(1.2); }
.slider:active::-moz-range-thumb { transform:scale(1.2); }
.btn-submit { width:100%; background:var(--amber); border:none; color:var(--bg); padding:10px; border-radius:6px; font-size:15px; cursor:pointer; font-family:var(--serif); font-weight:600; }

.add-cat-row { display:flex; gap:8px; margin-bottom:12px; align-items:center; }
.add-cat-row .input { margin-bottom:0; flex:1; }
.btn-cat-save { background:var(--amber); border:none; color:var(--bg); padding:10px 16px; border-radius:6px; font-size:13px; cursor:pointer; font-family:var(--serif); font-weight:600; flex-shrink:0; }

.edit-cats { background:var(--bg2); border:1px solid var(--border2); border-radius:8px; padding:16px; margin-bottom:16px; }
.edit-cats-title { font-size:12px; color:var(--dim); margin-bottom:12px; font-family:var(--mono); text-transform:uppercase; letter-spacing:2px; }
.edit-cats-list { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
.edit-cat-item { display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--bg); border-radius:6px; border:1px solid var(--border); }
.edit-cat-name { font-size:13px; color:var(--text2); font-family:var(--serif); cursor:pointer; }
.edit-cat-name:hover { color:var(--amber); }
.edit-cat-count { font-size:10px; color:var(--dim); font-family:var(--mono); margin-left:8px; }
.edit-cat-rename { display:flex; gap:6px; align-items:center; flex:1; }
.edit-cat-rename .input { margin-bottom:0; font-size:13px; padding:6px 10px; }
.btn-rename-save { background:var(--amber); border:none; color:var(--bg); padding:6px 12px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); flex-shrink:0; }
.btn-rename-cancel { background:transparent; border:1px solid var(--border2); color:var(--dim); padding:6px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); flex-shrink:0; }
.btn-remove-cat { background:transparent; border:none; color:var(--red); padding:4px 8px; font-size:14px; cursor:pointer; opacity:0.6; transition:opacity 0.15s; }
.btn-remove-cat:hover { opacity:1; }
.btn-remove-cat.disabled { opacity:0.15; cursor:not-allowed; }
.edit-cats-divider { height:1px; background:var(--border); margin:4px 0 14px 0; }
.edit-cats-add-label { font-size:11px; color:var(--dim); font-family:var(--mono); margin-bottom:6px; }

.done-section { background:var(--bg3); border-radius:8px; padding:16px; margin-bottom:16px; }
.done-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.done-label { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:2px; }
.btn-clear { background:transparent; border:none; color:var(--dim2); font-size:11px; cursor:pointer; font-family:var(--mono); }
.done-row { display:flex; gap:8px; padding:6px 0; align-items:center; cursor:pointer; }
.done-check { color:var(--green); font-size:12px; }
.done-title { font-size:13px; color:var(--dim2); text-decoration:line-through; }
.done-expanded { padding:6px 0 10px 20px; }
.done-meta { font-size:11px; color:var(--dim2); margin-bottom:8px; font-family:var(--mono); }
.done-actions { display:flex; gap:8px; }
.btn-reinstate { background:var(--border); border:1px solid var(--border2); color:var(--text); padding:4px 12px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); }

.group { margin-bottom:24px; }
.group-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.group-dot { width:6px; height:6px; border-radius:50%; }
.group-label { font-size:11px; text-transform:uppercase; letter-spacing:3px; font-family:var(--mono); }
.group-line { flex:1; height:1px; background:var(--border); }

.task-row { display:flex; gap:10px; padding:10px 8px; border-radius:6px; cursor:pointer; transition:background 0.15s; margin-bottom:2px; border-left:2px solid transparent; }
.task-row:active { background:var(--bg3); }
.btn-check { background:transparent; border:none; color:var(--dim2); font-size:18px; cursor:pointer; padding:2px 4px; line-height:1; flex-shrink:0; }
.task-content { flex:1; min-width:0; }
.task-title { font-size:15px; color:var(--text2); line-height:1.4; }
.task-meta { display:flex; gap:12px; margin-top:4px; font-size:11px; color:var(--dim2); font-family:var(--mono); }
.task-score { color:var(--dim); }
.task-expanded { margin-top:10px; padding-top:8px; border-top:1px solid var(--border); }
.score-row { display:flex; gap:20px; font-size:12px; color:var(--dim); margin-bottom:8px; font-family:var(--mono); }
.task-actions { display:flex; gap:8px; }
.btn-edit { background:var(--border); border:1px solid var(--border2); color:var(--text); padding:4px 12px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); }
.btn-delete { background:transparent; border:1px solid var(--redborder); color:var(--red); padding:4px 12px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); }
.btn-save-edit { background:var(--amber); border:none; color:var(--bg); padding:6px 16px; border-radius:4px; font-size:12px; cursor:pointer; font-family:var(--serif); font-weight:600; }
.btn-cancel-edit { background:transparent; border:1px solid var(--border2); color:var(--dim); padding:6px 14px; border-radius:4px; font-size:12px; cursor:pointer; font-family:var(--mono); }

.empty { text-align:center; padding:40px; color:var(--dim); font-size:14px; }
.loading { display:flex; justify-content:center; align-items:center; min-height:300px; color:var(--text); font-size:20px; }
.footer { text-align:center; margin-top:32px; padding-top:16px; border-top:1px solid var(--border); font-size:11px; color:var(--dim3); font-family:var(--mono); }
.error-banner { background:#fef0f0; border:1px solid var(--redborder); color:var(--red); padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:13px; font-family:var(--mono); }

/* === NOTES SYSTEM === */
.notes-container { display:flex; gap:0; min-height:70vh; position:relative; }
.notes-sidebar { width:240px; flex-shrink:0; border-right:1px solid var(--border); padding:12px 0; overflow-y:auto; max-height:calc(100vh - 80px); }
.notes-main { flex:1; padding:16px 24px; display:flex; flex-direction:column; min-width:0; }
.ns-header { display:flex; justify-content:space-between; align-items:center; padding:0 12px 10px; border-bottom:1px solid var(--border); margin-bottom:8px; }
.ns-title { font-size:12px; color:var(--dim); font-family:var(--mono); text-transform:uppercase; letter-spacing:2px; }
.ns-add { background:transparent; border:none; color:var(--amber); font-size:18px; cursor:pointer; padding:2px 6px; }

.ns-item { display:flex; align-items:center; padding:8px 12px; cursor:pointer; transition:background 0.1s; gap:4px; font-size:13px; color:var(--dim2); border-left:2px solid transparent; min-height:32px; }
.ns-item:hover { background:var(--bg3); }
.ns-item.active { background:var(--bg3); color:var(--text); border-left-color:var(--amber); }
.ns-item-label { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.ns-item-arrow { font-size:10px; color:var(--dim3); transition:transform 0.15s; flex-shrink:0; }
.ns-item-arrow.open { transform:rotate(90deg); }
.ns-item-actions { display:flex; gap:2px; opacity:0; transition:opacity 0.15s; flex-shrink:0; }
.ns-item:hover .ns-item-actions { opacity:1; }
.ns-item[draggable="true"] { cursor:grab; }
.ns-item[draggable="true"]:active { cursor:grabbing; }
.ns-item.drop-above { border-top:2px solid var(--amber) !important; }
.ns-item.drop-below { border-bottom:2px solid var(--amber) !important; }
.ns-item.drop-into { background:var(--amber) !important; color:var(--bg) !important; opacity:0.3; }
.ns-act-btn { background:transparent; border:none; color:var(--dim); font-size:11px; cursor:pointer; padding:2px 4px; }
.ns-act-btn:hover { color:var(--text); }
.ns-link-btn { background:transparent; border:none; color:var(--dim3); font-size:10px; cursor:pointer; padding:2px 4px; }
.ns-link-btn:hover { color:var(--amber); }
.ns-link-copied { color:var(--green) !important; }
.ns-move-btns { display:flex; flex-direction:column; gap:0; }
.ns-move-btn { background:transparent; border:none; color:var(--dim3); font-size:9px; cursor:pointer; padding:0 4px; line-height:1.2; }
.ns-move-btn:hover { color:var(--text); }

.note-editor { flex:1; display:flex; flex-direction:column; }
.note-title-input { background:transparent; border:none; color:var(--text3); font-size:22px; font-family:var(--serif); padding:4px 0; margin-bottom:12px; outline:none; border-bottom:1px solid var(--border); }

/* Formatting toolbar */
.note-toolbar { display:flex; gap:2px; padding:4px 0; margin-bottom:12px; border-bottom:1px solid var(--border); flex-wrap:wrap; align-items:center; }
.note-toolbar button { background:transparent; border:1px solid transparent; color:var(--dim); padding:4px 8px; border-radius:4px; font-size:13px; cursor:pointer; font-family:var(--mono); transition:all 0.1s; min-width:30px; text-align:center; }
.note-toolbar button:hover { background:var(--bg3); color:var(--text); border-color:var(--border); }
.note-toolbar button.active { background:var(--bg3); color:var(--amber); border-color:var(--border2); }
.note-toolbar .tb-sep { width:1px; background:var(--border); margin:2px 4px; align-self:stretch; }
.tb-select { background:var(--bg); border:1px solid var(--border); color:var(--text); padding:3px 6px; border-radius:4px; font-size:11px; font-family:var(--mono); cursor:pointer; max-width:110px; }
/* Screenplay mode indicator */
.sp-indicator { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-family:var(--mono); color:var(--amber); padding:0 6px; }
.sp-current-mode { font-size:10px; font-family:var(--mono); color:var(--dim); padding:2px 6px; background:var(--bg3); border-radius:3px; }

/* Screenplay toolbar */
.sp-toolbar { gap:4px; padding:2px 0 !important; }
.sp-btn { font-size:10px !important; padding:3px 8px !important; letter-spacing:0.3px; }
.sp-btn.sp-active { background:var(--amber) !important; color:var(--bg) !important; border-color:var(--amber) !important; }

/* Screenplay mode — Courier New 12pt, proper margins */
.note-body.sp-mode { font-family:"Courier New", Courier, monospace !important; font-size:12pt !important; line-height:1.0 !important; max-width:640px; }
.note-body.sp-mode .sp-action { display:block; text-align:left; margin:12px 0; padding-left:0 !important; padding-right:0 !important; }
.note-body.sp-mode .sp-character { display:block; text-align:left; text-transform:uppercase; margin:12px 0 0 0; padding-left:180px; padding-right:0; }
.note-body.sp-mode .sp-dialogue { display:block; margin:0 0 12px 0; padding-left:100px; padding-right:100px; }
.note-body.sp-mode .sp-paren { display:block; margin:0; padding-left:130px; padding-right:130px; font-style:italic; }
.note-body.sp-mode .sp-center { display:block; text-align:center; margin:12px 0; padding-left:0; padding-right:0; }
.note-body.sp-mode .sp-transition { display:block; text-align:right; text-transform:uppercase; margin:12px 0; padding-left:0; padding-right:0; }

.note-body { width:100%; background:transparent; border:none; color:var(--text); font-size:16px; font-family:var(--serif); padding:0; outline:none; resize:none; min-height:200px; line-height:1.7; overflow:hidden; white-space:pre-wrap; word-wrap:break-word; tab-size:6; -moz-tab-size:6; }
.note-body.empty-placeholder:before { content:attr(data-placeholder); color:var(--dim3); pointer-events:none; }
.note-body a { color:var(--blue); text-decoration:underline; cursor:pointer; }
.note-body a:hover { color:var(--amber); }
.note-empty { color:var(--dim); font-size:14px; text-align:center; padding:60px 20px; }
.note-sub-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.note-sub-add { background:var(--border); border:1px solid var(--border2); color:var(--text); padding:4px 10px; border-radius:4px; font-size:11px; cursor:pointer; font-family:var(--mono); }

/* Mobile sidebar toggle */
.ns-toggle { display:none; background:transparent; border:1px solid var(--border); color:var(--text); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-family:var(--mono); margin-bottom:10px; }
.ns-overlay { display:none; }

@media (max-width:700px) {
  .container { max-width:100%; padding:16px 12px; }
  .notes-sidebar {
    position:fixed; top:0; left:0; bottom:0; width:260px; z-index:90;
    background:var(--bg); border-right:1px solid var(--border);
    transform:translateX(-100%); transition:transform 0.2s ease;
    padding-top:16px; overflow-y:auto;
  }
  .notes-sidebar.open { transform:translateX(0); }
  .ns-overlay { display:block; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.2); z-index:80; }
  .ns-overlay.hidden { display:none; }
  .ns-toggle { display:inline-flex; align-items:center; gap:6px; }
  .ns-item-actions { opacity:1; }
  .notes-main { padding:8px 4px; }
  .note-title-input { font-size:18px; }
  .note-body { font-size:15px; }
}
</style>
</head>
<body>

<div class="nav-tabs" id="navTabs"></div>
<div class="container" id="app"><div class="loading">Loading Cache...</div></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwe7KffKrfxBJcIKKU2dOck7I84cx81whYSl21O0BlcKyYHQDtC6U5OyZ7vE7_B5uMLHg/exec";

const MODES = {
  all: { label: "All Tasks", icon: "◉", color: "#c4b5a0", desc: "Everything" },
  mind: { label: "Mind", icon: "✦", color: "#7ba0c4", desc: "Thinking, planning, creative ideation" },
  film: { label: "Film", icon: "◈", color: "#d4a056", desc: "Editing, shooting, post-production" },
  jppf: { label: "JPPF", icon: "◆", color: "#9b8ec4", desc: "Business tasks, clients, admin" },
};

const TIMELINES = ["Today", "This Week", "This Month", "This Quarter", "Later"];
const TIMELINE_COLORS = { "Today":"#c4882a", "This Week":"#b07a24", "This Month":"#8a857e", "This Quarter":"#9e9990", "Later":"#b5b0a8" };

let state = {
  view: "tasks", // "tasks" or "notes"
  tasks:[], doneTasks:[], categories:["JPPF Post","JPPF General","JPPF Chores","Hatman","General","Chores"],
  mode:"all", filterCat:"all",
  showAdd:false, showDone:false, showEditCats:false,
  expandedId:null, editingId:null, editData:null, expandedDoneId:null,
  newTask:{ title:"", category:"JPPF General", timeline:"This Quarter", valuable:3, urgency:3, mode:"mind" },
  newCatName:"", renamingCat:null, renameCatValue:"",
  saveStatus:"", loaded:false, error:null,
  // Notes (flat array from Sheet — each note is {id, parentId, title, content, sortOrder, createdAt})
  notesFlat:[], activePath:null, confirmDeletePath:null, sidebarOpen:false,
  noteSaveTimers:{}, notesLiteLoaded:false, isLoading:false, screenplayMode:false, spCurrentFormat:"action",
};

// === JSONP API ===
function apiCall(params) {
  return new Promise((resolve) => {
    const cb = "cb_" + Date.now() + "_" + Math.floor(Math.random()*10000);
    const timeout = setTimeout(() => { delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); resolve({error:"Timeout"}); }, 15000);
    window[cb] = function(data) { clearTimeout(timeout); delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); resolve(data); };
    var s = document.createElement("script");
    s.src = API_URL + "?" + params + "&callback=" + cb;
    s.onerror = function() { clearTimeout(timeout); delete window[cb]; if(s.parentNode)s.parentNode.removeChild(s); resolve({error:"Network error"}); };
    document.body.appendChild(s);
  });
}
function apiGet(action) { return apiCall("action=" + action); }
function apiPost(payload) { return apiCall("payload=" + encodeURIComponent(JSON.stringify(payload))); }

function showSave(msg, ok) { state.saveStatus = msg; render(); setTimeout(() => { state.saveStatus = ""; render(); }, ok ? 1500 : 3000); }

// Loading indicator
function setLoading(isLoading) {
  state.isLoading = isLoading;
  const el = document.getElementById("loadingIndicator");
  if (el) el.style.display = isLoading ? "flex" : "none";
}

async function bgSync() {
  try {
    if (state.view === "tasks") {
      const data = await apiGet("getTasksOnly");
      if (!data.error) {
        state.tasks = data.tasks || [];
        state.doneTasks = data.done || [];
        if (data.settings && data.settings.categories) state.categories = data.settings.categories.split(",").map(s=>s.trim()).filter(Boolean);
        render();
      }
    } else if (state.view === "notes") {
      // Don't sync if ANY saves are pending or notes are being created
      const hasPendingSaves = Object.keys(state.noteSaveTimers).length > 0 || Object.keys(creatingNotes).length > 0 || Object.keys(titleSaveTimers).length > 0 || Object.keys(contentSaveTimers).length > 0;
      if (hasPendingSaves) return;
      
      // Don't sync if user is actively typing in title or body
      const titleInput = document.getElementById("noteTitleInput");
      const bodyEl = document.getElementById("noteBody");
      const isTyping = (titleInput && document.activeElement === titleInput) || (bodyEl && document.activeElement === bodyEl);
      if (isTyping) return;
      
      const notes = await apiGet("getNotesLite");
      if (!notes.error && Array.isArray(notes)) {
        const activeId = state.activePath ? state.activePath[state.activePath.length - 1] : null;
        
        notes.forEach(serverNote => {
          const local = state.notesFlat.find(n => n.id === serverNote.id);
          if (local) {
            // NEVER overwrite the active note's title — user might be editing it
            if (serverNote.id !== activeId) {
              local.title = serverNote.title;
            }
            local.parentId = serverNote.parentId;
            local.sortOrder = serverNote.sortOrder;
          } else {
            state.notesFlat.push({ ...serverNote, content: undefined });
          }
        });
        
        // Remove notes that no longer exist on server (but keep locally created notes that haven't synced yet)
        const serverIds = notes.map(n => n.id);
        state.notesFlat = state.notesFlat.filter(n => serverIds.includes(n.id) || creatingNotes[n.id]);
        
        // Only re-render if not typing
        if (!isTyping) render();
      }
    }
  } catch(e) {}
}

  state.loaded = true; state.error = null; setLoading(false); render();

    state.notesFlat = notes.map(n => ({ ...n, content: undefined })); // No content yet

// Load single note content — called when clicking a note

async function addTask() {
  const t = state.newTask; if (!t.title.trim()) return;
  const tempId = "temp_" + Date.now();
  const priority = ((t.valuable + t.urgency) / 2);
  state.tasks.push({ id:tempId, title:t.title, category:t.category, timeline:t.timeline, priority:Math.round(priority*10)/10, valuable:t.valuable, urgency:t.urgency, mode:t.mode });
  state.newTask = { title:"", category:state.categories[0]||"General", timeline:"This Quarter", valuable:3, urgency:3, mode:"mind" };
  state.showAdd = false; showSave("Saving...", true);
  const result = await apiPost({ action:"addTask", task:t });
  if (result.error) showSave("Error: "+result.error, false); else showSave("Saved ✓", true);
  bgSync();
}

async function deleteTask(id) {

async function saveEdit() {

async function reinstateTask(id) {

async function deleteDone(id) {

async function addCategory() {

async function removeCategory(cat) {

  if (inUse) { alert('"'+cat+'" is still used by tasks.'); return; }
  const nc = state.categories.filter(c=>c!==cat);

function startRenameCategory(cat) { state.renamingCat=cat; state.renameCatValue=cat; render(); setTimeout(()=>{const el=document.getElementById("renameCatInput");if(el){el.focus();el.select();}},50); }

async function saveRenameCategory() {
  const oldName=state.renamingCat, newName=(state.renameCatValue||"").trim();
  if (!newName||newName===oldName) { state.renamingCat=null; render(); return; }
  if (state.categories.includes(newName)) { alert('"'+newName+'" already exists.'); return; }
  const nc = state.categories.map(c=>c===oldName?newName:c);
  state.tasks.forEach(t=>{if(t.category===oldName)t.category=newName;});
  state.doneTasks.forEach(t=>{if(t.category===oldName)t.category=newName;});
  state.categories=nc; if(state.filterCat===oldName)state.filterCat=newName;
  state.renamingCat=null; state.renameCatValue=""; showSave("Renaming...", true); render();
  await apiPost({ action:"updateCategories", categories:nc.join(",") });
  for (const t of state.tasks.filter(t=>t.category===newName)) { await apiPost({ action:"updateTask", task:t }); }
  showSave("Renamed ✓", true); bgSync();
}

// Build tree from flat array for rendering
function buildNoteTree(flatNotes, parentId) {
  return flatNotes
    .filter(n => (n.parentId || "") === (parentId || ""))
    .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0))
    .map(n => ({
      ...n,
      children: buildNoteTree(flatNotes, n.id)
    }));
}

function getNoteTree() { return buildNoteTree(state.notesFlat, ""); }

// Save a single note (debounced per-note) with status dot
function setSaveDot(color) {
  const dot = document.getElementById("saveDot");
  if (dot) { dot.style.background = color; dot.style.display = "block"; }
}
function hideSaveDot() {
  const dot = document.getElementById("saveDot");
  if (dot) setTimeout(() => { dot.style.display = "none"; }, 2000);
}

// Separate timers for title vs content
let titleSaveTimers = {};
let contentSaveTimers = {};

function saveNoteTitleDebounced(noteId) {
  // Don't save title if note is still being created on server
  if (creatingNotes[noteId]) return;
  setSaveDot("#d4a056");
  if (titleSaveTimers[noteId]) clearTimeout(titleSaveTimers[noteId]);
  titleSaveTimers[noteId] = setTimeout(async () => {
    delete titleSaveTimers[noteId];
    if (creatingNotes[noteId]) return; // Double-check
    const note = state.notesFlat.find(n => n.id === noteId);
    if (note) {
      const result = await apiPost({ action: "saveNote", note: { id: note.id, parentId: note.parentId, title: note.title, sortOrder: note.sortOrder, mode: note.mode || "" } });
      if (result && !result.error) { setSaveDot("#5a7a4a"); hideSaveDot(); }
      else { setSaveDot("#b04040"); }
    }
  }, 1500);
}

function saveNoteContentDebounced(noteId) {
  // Don't save content if note is still being created on server
  if (creatingNotes[noteId]) return;
  setSaveDot("#d4a056");
  if (contentSaveTimers[noteId]) clearTimeout(contentSaveTimers[noteId]);
  state.noteSaveTimers[noteId] = true;
  contentSaveTimers[noteId] = setTimeout(async () => {
    delete contentSaveTimers[noteId];
    delete state.noteSaveTimers[noteId];
    if (creatingNotes[noteId]) return; // Double-check
    const note = state.notesFlat.find(n => n.id === noteId);
    if (note && note.content !== undefined) {
      const result = await apiPostForm({ action: "saveNoteContent", noteId: noteId, content: note.content });
      if (result && !result.error) { setSaveDot("#5a7a4a"); hideSaveDot(); }
      else { setSaveDot("#b04040"); }
    }
  }, 2000);
}

// POST via hidden iframe form — handles large content without URL length limits
function apiPostForm(payload) {
  return new Promise((resolve) => {
    const id = "postframe_" + Date.now();
    const iframe = document.createElement("iframe");
    iframe.name = id;
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    const form = document.createElement("form");
    form.method = "POST";
    form.action = API_URL;
    form.target = id;
    form.style.display = "none";

    const input = document.createElement("input");
    input.type = "hidden";
    input.name = "payload";
    input.value = JSON.stringify(payload);
    form.appendChild(input);

    document.body.appendChild(form);

    // Listen for iframe load (response came back)
    iframe.onload = function() {
      // Give it a moment to render
      setTimeout(() => {
        try {
          const text = iframe.contentDocument.body.innerText;
          resolve(JSON.parse(text));
        } catch(e) {
          // Can't read cross-origin iframe — but if it loaded, the save likely worked
          resolve({ success: true });
        }
        document.body.removeChild(iframe);
        document.body.removeChild(form);
      }, 200);
    };

    iframe.onerror = function() {
      resolve({ error: "Network error" });
      document.body.removeChild(iframe);
      document.body.removeChild(form);
    };

    form.submit();

    // Timeout fallback
    setTimeout(() => {
      resolve({ success: true }); // Assume it worked if no response in 15s
    }, 15000);
  });
}

// Keep old name for compatibility with note structure saves (add, delete, move)
function saveNoteDebounced(noteId) {
  saveNoteTitleDebounced(noteId);
}

// Find note in flat list
function findNoteFlat(id) { return state.notesFlat.find(n => n.id === id); }

// Get the note pointed to by activePath
function getActiveNote() {
  if (!state.activePath || state.activePath.length === 0) return null;
  const id = state.activePath[state.activePath.length - 1];
  return findNoteFlat(id);
}

// Get children of a note
function getChildren(parentId) {
  return state.notesFlat
    .filter(n => (n.parentId || "") === (parentId || ""))
    .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
}

// Track notes that are still being created on the server
let creatingNotes = {};

function addNoteToList(parentPath) {
  const id = "n_" + Date.now() + "_" + Math.random().toString(36).substr(2,4);
  const parentId = parentPath && parentPath.length > 0 ? parentPath[parentPath.length - 1] : "";
  const siblings = getChildren(parentId);
  
  // Shift all siblings' sort order up by 1 to make room at top
  siblings.forEach(s => { s.sortOrder = (s.sortOrder || 0) + 1; });
  const sortOrder = 0;
  
  state.notesFlat.push({ id, parentId, title: "Untitled", content: "", sortOrder, createdAt: new Date().toISOString() });
  state.activePath = parentPath ? [...parentPath, id] : [id];
  
  if (parentId) expandedNodes[parentId] = true;
  
  // Mark as creating — blocks ALL saves for this note until creation completes
  creatingNotes[id] = true;
  
  render();
  
  // Serialize: create the note FIRST, then reorder siblings AFTER
  (async () => {
    try {
      await apiPost({ action: "saveNote", note: { id, parentId, title: "Untitled", content: "", sortOrder } });
      
      // Now reorder siblings (only after the note exists on server)
      const reorderUpdates = siblings.map(s => ({ id: s.id, sortOrder: s.sortOrder }));
      if (reorderUpdates.length > 0) {
        await apiPost({ action: "reorderNotes", updates: reorderUpdates });
      }
    } finally {
      delete creatingNotes[id];
    }
    
    // If user already changed the title while we were creating, save it now
    const note = findNoteFlat(id);
    if (note && note.title !== "Untitled") {
      saveNoteTitleDebounced(id);
    }
  })();
  
  setTimeout(() => { const el = document.getElementById("noteTitleInput"); if (el) { el.focus(); el.select(); } }, 100);
}

function confirmDeleteNote(pathStr) {
  state.confirmDeletePath = pathStr.split("|");
  render();
}

function cancelDelete() {
  state.confirmDeletePath = null;
  render();
}

async function executeDelete() {
  const path = state.confirmDeletePath;
  if (!path || path.length === 0) return;
  const id = path[path.length - 1];
  
  // Collect all descendant IDs
  const toDelete = collectDescendants(id);
  
  // Remove from local state
  state.notesFlat = state.notesFlat.filter(n => toDelete.indexOf(n.id) === -1);
  
  if (state.activePath && toDelete.indexOf(state.activePath[state.activePath.length - 1]) !== -1) {
    state.activePath = null;
  }
  state.confirmDeletePath = null;
  render();
  
  // Delete from Sheet
  await apiPost({ action: "deleteNoteRecursive", id });
}

function collectDescendants(id) {
  const result = [id];
  const children = state.notesFlat.filter(n => n.parentId === id);
  children.forEach(c => {
    result.push(...collectDescendants(c.id));
  });
  return result;
}

function moveNoteToTop(path) {
  if (!path || path.length === 0) return;
  const id = path[path.length - 1];
  const note = findNoteFlat(id);
  if (!note) return;
  const siblings = getChildren(note.parentId || "");
  // Set this note to -1, then renumber all
  note.sortOrder = -1;
  let order = 0;
  siblings.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0)).forEach(s => { s.sortOrder = order++; });
  render();
  const updates = siblings.map(s => ({ id: s.id, sortOrder: s.sortOrder }));
  apiPost({ action: "reorderNotes", updates });
}

function moveNoteToBottom(path) {
  if (!path || path.length === 0) return;
  const id = path[path.length - 1];
  const note = findNoteFlat(id);
  if (!note) return;
  const siblings = getChildren(note.parentId || "");
  note.sortOrder = 99999;
  let order = 0;
  siblings.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0)).forEach(s => { s.sortOrder = order++; });
  render();
  const updates = siblings.map(s => ({ id: s.id, sortOrder: s.sortOrder }));
  apiPost({ action: "reorderNotes", updates });
}

// === DRAG AND DROP ===
let dragNoteId = null;
let dragNoteParentId = null;

function onDragStart(e, noteId, parentId) {
  dragNoteId = noteId;
  dragNoteParentId = parentId;
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setData("text/plain", noteId);
  e.target.closest(".ns-item").style.opacity = "0.4";
}

function onDragEnd(e) {
  e.target.closest(".ns-item").style.opacity = "1";
  dragNoteId = null;
  dragNoteParentId = null;
  // Remove all drop indicators
  document.querySelectorAll(".drop-above,.drop-below,.drop-into").forEach(el => {
    el.classList.remove("drop-above","drop-below","drop-into");
  });
}

function onDragOver(e, targetId, targetParentId) {
  e.preventDefault();
  if (targetId === dragNoteId) return;
  e.dataTransfer.dropEffect = "move";
  
  const item = e.target.closest(".ns-item");
  if (!item) return;
  
  // Remove old indicators
  document.querySelectorAll(".drop-above,.drop-below,.drop-into").forEach(el => {
    el.classList.remove("drop-above","drop-below","drop-into");
  });
  
  const rect = item.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const third = rect.height / 3;
  
  if (y < third) {
    item.classList.add("drop-above");
  } else if (y > third * 2) {
    item.classList.add("drop-below");
  } else {
    item.classList.add("drop-into"); // Drop as child
  }
}

function onDrop(e, targetId, targetParentId) {
  e.preventDefault();
  if (!dragNoteId || targetId === dragNoteId) return;
  
  const item = e.target.closest(".ns-item");
  if (!item) return;
  
  const rect = item.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const third = rect.height / 3;
  
  const dragNote = findNoteFlat(dragNoteId);
  if (!dragNote) return;
  
  // Prevent dropping a parent into its own child
  const descendants = collectDescendants(dragNoteId);
  if (descendants.includes(targetId)) return;
  
  if (y < third) {
    // Drop ABOVE target — same parent as target, sort order just before target
    const targetNote = findNoteFlat(targetId);
    dragNote.parentId = targetNote.parentId || "";
    const siblings = getChildren(dragNote.parentId);
    const targetIdx = siblings.findIndex(n => n.id === targetId);
    dragNote.sortOrder = (targetNote.sortOrder || 0) - 0.5;
  } else if (y > third * 2) {
    // Drop BELOW target — same parent as target, sort order just after target
    const targetNote = findNoteFlat(targetId);
    dragNote.parentId = targetNote.parentId || "";
    dragNote.sortOrder = (targetNote.sortOrder || 0) + 0.5;
  } else {
    // Drop INTO target — becomes child of target
    dragNote.parentId = targetId;
    const children = getChildren(targetId);
    dragNote.sortOrder = children.length;
    expandedNodes[targetId] = true;
  }
  
  // Renumber all siblings in the new parent
  const newSiblings = getChildren(dragNote.parentId);
  newSiblings.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
  newSiblings.forEach((s, i) => { s.sortOrder = i; });
  
  // Also renumber old parent's children
  if (dragNoteParentId !== dragNote.parentId) {
    const oldSiblings = getChildren(dragNoteParentId || "");
    oldSiblings.sort((a,b) => (a.sortOrder||0) - (b.sortOrder||0));
    oldSiblings.forEach((s, i) => { s.sortOrder = i; });
  }
  
  // Remove indicators
  document.querySelectorAll(".drop-above,.drop-below,.drop-into").forEach(el => {
    el.classList.remove("drop-above","drop-below","drop-into");
  });
  
  render();
  
  // Save the moved note (new parent + sort order) and reorder siblings
  apiPost({ action: "saveNote", note: { id: dragNote.id, parentId: dragNote.parentId, title: dragNote.title, sortOrder: dragNote.sortOrder } });
  const allUpdates = [...getChildren(dragNote.parentId)];
  if (dragNoteParentId !== dragNote.parentId) allUpdates.push(...getChildren(dragNoteParentId || ""));
  apiPost({ action: "reorderNotes", updates: allUpdates.map(n => ({ id: n.id, sortOrder: n.sortOrder })) });
  
  dragNoteId = null;
  dragNoteParentId = null;
}

// Expanded nodes tracker
let expandedNodes = {};
function toggleExpand(id) { expandedNodes[id] = !expandedNodes[id]; render(); }

// === HELPERS ===
function esc(s) { const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function getFiltered() {
  return state.tasks.filter(t=>{
    if (state.mode!=="all"&&t.mode!==state.mode) return false;
    if (state.filterCat!=="all"&&t.category!==state.filterCat) return false;
    return true;
  }).sort((a,b)=>{
    const tOrder=TIMELINES.indexOf(a.timeline)-TIMELINES.indexOf(b.timeline);
    if(tOrder!==0) return tOrder;
    return (b.priority||0)-(a.priority||0);
  });
}

function groupByTimeline(tasks) {
  const g={};
  TIMELINES.forEach(tl=>{ const items=tasks.filter(t=>t.timeline===tl); if(items.length>0)g[tl]=items; });
  return g;
}

function closeAllPanels(except) {
  if(except!=="add")state.showAdd=false;
  if(except!=="done")state.showDone=false;
  if(except!=="editCats")state.showEditCats=false;
}

// === RENDER ===
function render(force) {
  // GUARD: Don't re-render notes view while user is actively editing
  // This prevents the DOM from being rebuilt, which would destroy cursor position and typed text
  if (!force && state.view === "notes") {
    const titleInput = document.getElementById("noteTitleInput");
    const bodyEl = document.getElementById("noteBody");
    const isTyping = (titleInput && document.activeElement === titleInput) || (bodyEl && document.activeElement === bodyEl);
    if (isTyping) {
      // Only update the sidebar labels without rebuilding the editor
      updateSidebarOnly();
      return;
    }
  }

  // Nav tabs
  document.getElementById("navTabs").innerHTML =
    `<button class="nav-tab ${state.view==="notes"?"active":""}" onclick="state.view='notes';updateHash();loadNotesLite();render()">Notes</button>` +
    `<button class="nav-tab ${state.view==="tasks"?"active":""}" onclick="state.view='tasks';updateHash();render()">Tasks</button>` +
    `<div style="display:flex;align-items:center;gap:8px;padding:0 12px;margin-left:auto;">` +
    `<div id="saveDot" style="display:none;width:10px;height:10px;border-radius:50%;transition:background 0.3s;" title="Yellow=saving, Green=saved"></div>` +
    `<div id="loadingIndicator" style="display:${state.isLoading?"flex":"none"};align-items:center;"><div style="width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin 0.8s linear infinite;"></div></div>` +
    `</div>`;

  // Inject spinner animation if not already present
  if (!document.getElementById("spinnerCSS")) {
    const style = document.createElement("style");
    style.id = "spinnerCSS";
    style.textContent = "@keyframes spin { to { transform: rotate(360deg); } }";
    document.head.appendChild(style);
  }

  const app = document.getElementById("app");
  if (!state.loaded) { app.innerHTML='<div class="loading">Loading Cache...</div>'; return; }

  if (state.view === "notes") { renderNotes(app); return; }
  renderTasks(app);
}

function updateSidebarOnly() {
  const sidebar = document.querySelector(".notes-sidebar");
  if (!sidebar) return;
  const noteTree = getNoteTree();
  const headerHTML = '<div class="ns-header"><span class="ns-title">Notes</span><button class="ns-add" onclick="addNoteToList([])" title="New note">+</button></div>';
  sidebar.innerHTML = headerHTML + renderNoteTreeHTML(noteTree, []);
}

function renderTasks(app) {
  const filtered = getFiltered();
  const grouped = groupByTimeline(filtered);
  const m = MODES[state.mode];
  let html = '';

  if (state.error) html += `<div class="error-banner">${esc(state.error)}</div>`;

  // Header
  html += `<div class="header"><div class="header-top"><h1 class="title">THE CACHE</h1><div class="header-right">`;
  if (state.saveStatus) html += `<div class="save-status ${state.saveStatus.includes("✓")?"save-ok":"save-err"}">${esc(state.saveStatus)}</div>`;

  // Mode bar
  html += '<div class="mode-bar">';

    const active = state.mode===key;
    const style = active ? `background:${mo.color}22;border-color:${mo.color};color:${mo.color}` : "";

  // Cat filter

    html += `<button class="cat-btn ${state.filterCat===c?"active":""}" onclick="state.filterCat='${esc(c)}';render()">${esc(c.replace("JPPF ",""))}</button>`;
  });
  html += '</div>';

  // Action buttons
  html += '<div class="top-bar">';
  html += `<button class="btn-add" onclick="closeAllPanels('add');state.showAdd=!state.showAdd;render()">${state.showAdd?"✕ Cancel":"+ Add Task"}</button>`;
  html += `<button class="btn-done" onclick="closeAllPanels('done');state.showDone=!state.showDone;state.expandedDoneId=null;render()">${state.showDone?"Hide Done":"Done ("+state.doneTasks.length+")"}</button>`;
  html += `<button class="btn-cat" onclick="closeAllPanels('editCats');state.showEditCats=!state.showEditCats;render()">${state.showEditCats?"✕ Close":"Edit Categories"}</button>`;
  html += '</div>';

  // Edit Categories
  if (state.showEditCats) {
    html += '<div class="edit-cats"><div class="edit-cats-title">Categories</div><div class="edit-cats-list">';

      const count = state.tasks.filter(t=>t.category===c).length;

        html += `<div class="edit-cat-rename"><input class="input" id="renameCatInput" value="${esc(state.renameCatValue)}" oninput="state.renameCatValue=this.value" onkeydown="if(event.key==='Enter')saveRenameCategory();if(event.key==='Escape'){state.renamingCat=null;render()}"><button class="btn-rename-save" onclick="saveRenameCategory()">Save</button><button class="btn-rename-cancel" onclick="state.renamingCat=null;render()">✕</button></div>`;
      } else {
        html += `<div><span class="edit-cat-name" onclick="startRenameCategory('${esc(c)}')" title="Click to rename">${esc(c)}</span><span class="edit-cat-count">${count} task${count!==1?"s":""}</span></div>`;
        html += `<button class="btn-remove-cat ${inUse?"disabled":""}" onclick="${inUse?"":"removeCategory('"+esc(c)+"')"}" title="${inUse?"In use":"Remove"}">✕</button>`;

  // Add task form

    html += '<div class="panel">';

      }
    });
    html += '</div>';
  }

  // Task list
  Object.entries(grouped).forEach(([timeline, items]) => {
    const color = TIMELINE_COLORS[timeline]||"#7a7568";
    html += '<div class="group">';
    html += `<div class="group-header"><div class="group-dot" style="background:${color}"></div><span class="group-label" style="color:${color}">${timeline}</span><div class="group-line"></div></div>`;
    items.forEach(task => {

      html += `<div class="task-content" onclick="if(state.editingId==='${task.id}')return;state.expandedId=state.expandedId==='${task.id}'?null:'${task.id}';render()">`;
      html += `<div class="task-title">${esc(task.title)}</div>`;
      html += `<div class="task-meta"><span>${esc(task.category)}</span><span class="task-score">P ${task.priority}</span><span style="color:${mi.color}">${mi.icon} ${task.mode}</span></div>`;

      if (state.expandedId===task.id && state.editingId!==task.id) {
        html += `<div class="task-expanded"><div class="score-row"><span>Value: ${task.valuable}/10</span><span>Urgency: ${task.urgency}/10</span></div>`;
        html += `<div class="task-actions"><button class="btn-edit" onclick="event.stopPropagation();state.editingId='${task.id}';state.editData=JSON.parse(JSON.stringify(state.tasks.find(t=>t.id==='${task.id}')));render()">Edit task</button><button class="btn-delete" onclick="event.stopPropagation();deleteTask('${task.id}')">Delete</button></div></div>`;

        const ed = state.editData;
        html += '<div class="task-expanded" onclick="event.stopPropagation()">';
        html += `<input class="input" value="${esc(ed.title)}" oninput="state.editData.title=this.value">`;
        html += '<div class="form-row">';
        html += `<select class="select" onchange="state.editData.category=this.value">${state.categories.map(c=>`<option value="${esc(c)}" ${ed.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select>`;

        html += `<select class="select" onchange="state.editData.mode=this.value"><option value="mind" ${ed.mode==="mind"?"selected":""}>✦ Mind</option><option value="film" ${ed.mode==="film"?"selected":""}>◈ Film</option><option value="jppf" ${ed.mode==="jppf"?"selected":""}>◆ JPPF</option></select>`;
        html += '</div><div class="form-row-sliders">';
        html += `<label class="slider-label">Value: ${ed.valuable}<input type="range" class="slider" min="0" max="10" value="${ed.valuable}" oninput="state.editData.valuable=+this.value;render()" step="1"></label>`;
        html += `<label class="slider-label">Urgency: ${ed.urgency}<input type="range" class="slider" min="0" max="10" value="${ed.urgency}" oninput="state.editData.urgency=+this.value;render()" step="1"></label>`;
        html += '</div><div class="task-actions">';
        html += `<button class="btn-save-edit" onclick="event.stopPropagation();saveEdit()">Save</button>`;
        html += `<button class="btn-cancel-edit" onclick="event.stopPropagation();state.editingId=null;state.editData=null;render()">Cancel</button>`;
        html += `<button class="btn-delete" style="margin-left:auto" onclick="event.stopPropagation();deleteTask('${task.id}')">Delete</button></div></div>`;
      }
      html += '</div></div>';
    });
    html += '</div>';
  });

  if (Object.keys(grouped).length===0) html += '<div class="empty">No tasks match this filter.</div>';
  html += '<div class="footer">Synced with Google Sheets · Mind / Film / JPPF</div>';
  app.innerHTML = html;

  if (state.showEditCats) { const el=document.getElementById("newCatInput"); if(el&&!state.renamingCat)el.focus(); }
}

    html += '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;max-width:340px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.1);">';

    else html += '<div style="font-size:12px;color:var(--dim);margin-bottom:12px;font-family:var(--mono);">This cannot be undone.</div>';

    html += '<option value="Courier New, monospace">Courier New</option>';
    html += '</select>';
    html += '<select class="tb-select" onchange="document.execCommand(\'fontSize\',false,this.value);document.getElementById(\'noteBody\').focus()" title="Font Size">';
    html += '<option value="2">Small</option>';
    html += '<option value="3" selected>Normal</option>';
    html += '<option value="4">Medium</option>';
    html += '<option value="5">Large</option>';
    html += '<option value="6">X-Large</option>';
    html += '</select>';
    html += '<div class="tb-sep"></div>';
    html += '<button onmousedown="event.preventDefault();document.execCommand(\'bold\')" title="Bold (Ctrl+B)"><b>B</b></button>';
    html += '<button onmousedown="event.preventDefault();document.execCommand(\'italic\')" title="Italic (Ctrl+I)"><i>I</i></button>';
    html += '<button onmousedown="event.preventDefault();document.execCommand(\'underline\')" title="Underline (Ctrl+U)"><u>U</u></button>';
    html += '<button onmousedown="event.preventDefault();document.execCommand(\'strikeThrough\')" title="Strikethrough"><s>S</s></button>';
    html += '<div class="tb-sep"></div>';
    html += '<button onmousedown="event.preventDefault();insertLink()" title="Insert Link (Ctrl+K)">🔗</button>';
    html += '<button onmousedown="event.preventDefault();copyScreenplayFormatted()" title="Copy with formatting">📋</button>';
    html += '<button onmousedown="event.preventDefault();printScreenplay()" title="Print / Save as PDF">🖨</button>';
    // Screenplay toggle — camera emoji
    html += `<button onmousedown="event.preventDefault();toggleScreenplay()" title="Toggle Screenplay Mode" style="${state.screenplayMode?"background:var(--amber);color:var(--bg);border-color:var(--amber);":""}">🎥</button>`;
    html += '<button onmousedown="event.preventDefault();document.execCommand(\'removeFormat\')" title="Remove Formatting">✕</button>';

    // Screenplay element bar — only shows when screenplay mode is on
    if (state.screenplayMode) {
      html += '<div class="note-toolbar sp-toolbar">';
      html += `<button onmousedown="event.preventDefault();spFormat('action')" class="sp-btn ${state.spCurrentFormat==='action'?'sp-active':''}">Action</button>`;

      html += `<button onmousedown="event.preventDefault();spFormatParen()" class="sp-btn ${state.spCurrentFormat==='paren'?'sp-active':''}">Paren.</button>`;
      html += `<button onmousedown="event.preventDefault();spFormat('center')" class="sp-btn ${state.spCurrentFormat==='center'?'sp-active':''}">Center</button>`;

      html += `<span class="sp-current-mode">${state.spCurrentFormat}</span>`;
      html += '</div>';
    }
    
    if (activeNote.content === undefined) {
      html += '<div style="color:var(--dim);font-size:14px;padding:20px 0;">Loading note...</div>';

      html += `<div class="note-body${spClass}" id="noteBody" contenteditable="true" oninput="onNoteBodyInput()" data-placeholder="${state.screenplayMode?"INT. LOCATION - DAY":"Start writing..."}">${activeNote.content||""}</div>`;

    html += '<div class="note-empty">Select a note or click + to create one</div>';
  }
  html += '</div></div>';
  app.innerHTML = html;

  // Setup contenteditable placeholder + keyboard shortcuts
  const body = document.getElementById("noteBody");
  if (body) {
    if (!body.innerText.trim()) body.classList.add("empty-placeholder");
    body.addEventListener("focus", () => body.classList.remove("empty-placeholder"));
    body.addEventListener("blur", () => { if (!body.innerText.trim()) body.classList.add("empty-placeholder"); });
    // Make links clickable — tap/click opens the link
    body.addEventListener("click", (e) => {
      const link = e.target.closest("a");
      if (link && link.href) {
        // On mobile, first tap selects, second tap should open
        // Give a brief window to detect double-tap
        if (link.dataset.tapped) {
          e.preventDefault();
          e.stopPropagation();
          window.open(link.href, "_blank");
          link.dataset.tapped = "";
          return;
        }
        link.dataset.tapped = "1";
        setTimeout(() => { link.dataset.tapped = ""; }, 600);
      }
    });
    // Ctrl/Cmd+click always opens link immediately (desktop)
    body.addEventListener("mousedown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.target.closest("a")) {
        e.preventDefault();
        window.open(e.target.closest("a").href, "_blank");
      }
    });
    // Keyboard shortcuts
    body.addEventListener("keydown", (e) => {
      // Tab — in screenplay mode, cycles formats. Otherwise, insert indent.
      if (e.key === "Tab" && !state.screenplayMode) {
        e.preventDefault();
        document.execCommand("insertHTML", false, '<span style="display:inline-block;width:3.6em;"></span>');
        onNoteBodyInput();
      }
      // Ctrl+Shift+X = strikethrough
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "x") {
        e.preventDefault();
        document.execCommand("strikeThrough");
        onNoteBodyInput();
      }
      // Ctrl+K = insert link
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        insertLink();
      }
    });
  }
}

function renderNoteTreeHTML(list, parentPath, depth) {
  depth = depth || 0;
  if (!list || list.length === 0) return "";
  const maxIndent = 6;
  const indent = Math.min(depth, maxIndent) * 12;
  let html = "";

  list.forEach((note, i) => {
    const path = [...parentPath, note.id];
    const pathStr = path.join("|");
    const isActive = state.activePath && state.activePath.join("|") === pathStr;
    const hasChildren = note.children && note.children.length > 0;
    const isExpanded = expandedNodes[note.id];

    html += `<div class="ns-item ${isActive?"active":""}" data-note-id="${note.id}" style="padding-left:${12+indent}px" onclick="navByPath('${pathStr}')" draggable="true" ondragstart="onDragStart(event,'${note.id}','${note.parentId||""}')" ondragend="onDragEnd(event)" ondragover="onDragOver(event,'${note.id}','${note.parentId||""}')" ondrop="onDrop(event,'${note.id}','${note.parentId||""}')">`;

    // Expand arrow
    if (hasChildren) {
      html += `<span class="ns-item-arrow ${isExpanded?"open":""}" onclick="event.stopPropagation();toggleExpand('${note.id}')">▶</span>`;
    } else if (depth > 0) {
      html += '<span style="width:12px;display:inline-block;"></span>';
    }

    html += `<span class="ns-item-label">${esc(note.title)}</span>`;

    html += '<div class="ns-item-actions">';
    html += `<button class="ns-act-btn" onclick="event.stopPropagation();addNoteToList(pathFromStr('${pathStr}'))" title="Add sub-note">+</button>`;
    html += `<button class="ns-link-btn" onclick="event.stopPropagation();copyLinkByPath('${pathStr}',this)" title="Copy link">🔗</button>`;
    html += `<div class="ns-move-btns"><button class="ns-move-btn" onclick="event.stopPropagation();moveNoteToTop(pathFromStr('${pathStr}'))" title="Move to top">⤒</button><button class="ns-move-btn" onclick="event.stopPropagation();moveNoteToBottom(pathFromStr('${pathStr}'))" title="Move to bottom">⤓</button></div>`;
    html += `<button class="ns-act-btn" onclick="event.stopPropagation();confirmDeleteNote('${pathStr}')" title="Delete">✕</button>`;
    html += '</div></div>';

    // Render children recursively if expanded
    if (hasChildren && isExpanded) {
      html += renderNoteTreeHTML(note.children, path, depth + 1);
    }
  });

  return html;
}

// Path helpers — convert between pipe-separated string and array
function pathFromStr(s) { return s.split("|"); }
function navByPath(s) { navigateToNote(pathFromStr(s)); }
function copyLinkByPath(s, btn) { copyNoteLink(pathFromStr(s), btn); }

function updateNoteField(field, value) {
  const note = getActiveNote();
  if (!note) return;
  note[field] = value;
  
  if (field === "title") {
    const items = document.querySelectorAll("[data-note-id='" + note.id + "'] .ns-item-label");
    items.forEach(el => { el.textContent = value || "Untitled"; });
    saveNoteTitleDebounced(note.id);
  } else if (field === "content") {
    saveNoteContentDebounced(note.id);
  }
}

// Called from contenteditable div's oninput — saves innerHTML (rich text)
function onNoteBodyInput() {
  const body = document.getElementById("noteBody");
  if (!body) return;
  const note = getActiveNote();
  if (!note) return;
  note.content = body.innerHTML;
  lastLocalContentHash = simpleHash(body.innerHTML);
  saveNoteContentDebounced(note.id);
}

function insertLink() {
  const body = document.getElementById("noteBody");
  if (!body) return;
  
  const sel = window.getSelection();
  let savedRange = null;
  let hasSelection = false;
  if (sel && sel.rangeCount > 0) {
    savedRange = sel.getRangeAt(0).cloneRange();
    hasSelection = !sel.isCollapsed;
  }
  
  const url = prompt("Enter URL:", "https://");
  if (!url || url === "https://") return;
  
  body.focus();
  if (savedRange) {
    sel.removeAllRanges();
    sel.addRange(savedRange);
  }
  
  if (hasSelection) {
    document.execCommand("createLink", false, url);
  } else {
    document.execCommand("insertHTML", false, `<a href="${url}" target="_blank" rel="noopener" contenteditable="false">${esc(url)}</a>&nbsp;`);
  }
  
  setTimeout(() => {
    const links = body.querySelectorAll("a");
    links.forEach(a => {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
      a.setAttribute("contenteditable", "false");
    });
    onNoteBodyInput();
  }, 50);
}

// === SCREENPLAY MODE ===
const SP_FORMATS = ["action", "character", "dialogue", "paren", "center", "transition"];

function toggleScreenplay() {
  state.screenplayMode = !state.screenplayMode;
  state.spCurrentFormat = "action";
  
  // Save the mode to the note so it persists across devices/reloads
  const note = getActiveNote();
  if (note) {
    note.mode = state.screenplayMode ? "screenplay" : "";
    saveNoteTitleDebounced(note.id);
  }
  
  // When switching to screenplay mode, strip all inline font/size styling
  // so the parent .sp-mode CSS (Courier New 12pt) takes over cleanly
  if (state.screenplayMode) {
    const body = document.getElementById("noteBody");
    if (body) {
      // Remove <font> tags (created by execCommand fontName/fontSize)
      body.querySelectorAll("font").forEach(f => {
        const span = document.createElement("span");
        span.innerHTML = f.innerHTML;
        f.replaceWith(span);
      });
      // Remove inline font-family and font-size from any element
      body.querySelectorAll("[style]").forEach(el => {
        el.style.fontFamily = "";
        el.style.fontSize = "";
      });
      if (note) { note.content = body.innerHTML; saveNoteContentDebounced(note.id); }
    }
  }
  
  render(true);
  const body = document.getElementById("noteBody");
  if (body) body.focus();
}

// Parenthetical — special: creates () and places cursor inside
function spFormatParen() {
  state.spCurrentFormat = "paren";
  const body = document.getElementById("noteBody");
  if (!body) return;
  body.focus();
  
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  
  const node = sel.anchorNode;
  const parentEl = node.nodeType === 3 ? node.parentElement : node;
  let topEl = parentEl;
  while (topEl && topEl.parentElement !== body) {
    topEl = topEl.parentElement;
  }
  
  // If current line is empty, transform it into a paren line
  if (topEl && topEl.parentElement === body && topEl.textContent.trim() === "") {
    topEl.className = "sp-paren";
    topEl.innerHTML = "()";
    // Place cursor between the parens
    const textNode = topEl.firstChild;
    const range = document.createRange();
    range.setStart(textNode, 1); // After the (
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    // Create new paren line after current
    const newDiv = document.createElement("div");
    newDiv.className = "sp-paren";
    newDiv.innerHTML = "()";
    if (topEl && topEl.parentElement === body) {
      topEl.after(newDiv);
    } else {
      body.appendChild(newDiv);
    }
    const textNode = newDiv.firstChild;
    const range = document.createRange();
    range.setStart(textNode, 1);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  
  onNoteBodyInput();
  spUpdateUI("paren");
}

function spFormat(type) {
  state.spCurrentFormat = type;
  const body = document.getElementById("noteBody");
  if (!body) return;
  body.focus();
  
  // Find the current block element the cursor is in
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) return;
  
  const node = sel.anchorNode;
  const parentEl = node.nodeType === 3 ? node.parentElement : node;
  
  // Walk up to find the top-level element (direct child of body)
  let topEl = parentEl;
  while (topEl && topEl.parentElement !== body) {
    topEl = topEl.parentElement;
  }
  
  if (topEl && topEl.parentElement === body) {
    // If leaving paren format, strip the ( ) characters
    if (topEl.classList.contains("sp-paren") && type !== "paren") {
      let text = topEl.textContent;
      // Remove leading ( and trailing )
      text = text.replace(/^\(/, "").replace(/\)$/, "").trim();
      topEl.textContent = text || "";
      if (!text) topEl.innerHTML = "<br>";
      // Reposition cursor at end
      const range = document.createRange();
      if (topEl.firstChild) {
        range.setStart(topEl.firstChild, topEl.firstChild.textContent.length);
      } else {
        range.setStart(topEl, 0);
      }
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    // Transform the existing element — swap the class
    topEl.className = "sp-" + type;
  } else {
    // No block found — create new block
    const newDiv = document.createElement("div");
    newDiv.className = "sp-" + type;
    newDiv.innerHTML = "<br>";
    body.appendChild(newDiv);
    const range = document.createRange();
    range.setStart(newDiv, 0);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  
  onNoteBodyInput();
  spUpdateUI(type);
}

function spUpdateUI(type) {
  document.querySelectorAll(".sp-btn").forEach(btn => btn.classList.remove("sp-active"));
  document.querySelectorAll(".sp-btn").forEach(btn => {
    const label = btn.textContent.toLowerCase();
    if ((type === "character" && label === "name") || label === type) btn.classList.add("sp-active");
  });
  const modeLabel = document.querySelector(".sp-current-mode");
  if (modeLabel) modeLabel.textContent = type;
}

function spCycleFormat() {
  const idx = SP_FORMATS.indexOf(state.spCurrentFormat);
  const next = SP_FORMATS[(idx + 1) % SP_FORMATS.length];
  if (next === "paren") {
    spFormatParen();
  } else {
    spFormat(next);
  }
}

// Keyboard handler for screenplay mode
document.addEventListener("keydown", function(e) {
  if (!state.screenplayMode) return;
  const body = document.getElementById("noteBody");
  if (!body || document.activeElement !== body) return;
  
  // Tab = cycle through screenplay formats
  if (e.key === "Tab") {
    e.preventDefault();
    spCycleFormat();
    return;
  }
  
  // Enter handling
  if (e.key === "Enter") {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      const node = sel.anchorNode;
      const parentEl = node.nodeType === 3 ? node.parentElement : node;
      
      const body = document.getElementById("noteBody");
      let spEl = parentEl;
      while (spEl && spEl.parentElement !== body) {
        spEl = spEl.parentElement;
      }
      
      if (spEl && spEl.parentElement === body) {
        const isEmpty = spEl.textContent.trim() === "";
        
        // Empty action line (triple-enter) → insert blank spacer
        if (isEmpty && spEl.classList.contains("sp-action")) {
          e.preventDefault();
          const spacer = document.createElement("div");
          spacer.className = "sp-action";
          spacer.innerHTML = "<br>";
          spEl.after(spacer);
          const range = document.createRange();
          range.setStart(spacer, 0);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
          onNoteBodyInput();
          return;
        }
        
        // Double-enter (empty line) from ANYTHING else → action
        if (isEmpty) {
          e.preventDefault();
          spEl.remove();
          spAutoAdvance("action");
          return;
        }
        
        // Character name + Enter → dialogue
        if (spEl.classList.contains("sp-character")) {
          e.preventDefault();
          spAutoAdvance("dialogue");
          return;
        }
        
        // Parenthetical + Enter → dialogue (keep the closing paren on current line)
        if (spEl.classList.contains("sp-paren")) {
          e.preventDefault();
          // Make sure the text ends with )
          const text = spEl.textContent;
          if (!text.endsWith(")")) {
            spEl.textContent = text + ")";
          }
          spAutoAdvance("dialogue");
          return;
        }
        
        // Dialogue + Enter → name
        if (spEl.classList.contains("sp-dialogue")) {
          e.preventDefault();
          spAutoAdvance("character");
          return;
        }
      }
    }
  }
  
  // Ctrl+1-6 shortcuts
  if (e.ctrlKey || e.metaKey) {
    const formatMap = {"1":"action","2":"character","3":"dialogue","4":"paren","5":"center","6":"transition"};
    if (formatMap[e.key]) {
      e.preventDefault();
      if (formatMap[e.key] === "paren") { spFormatParen(); }
      else { spFormat(formatMap[e.key]); }
    }
  }
});

function spAutoAdvance(type) {
  state.spCurrentFormat = type;
  const body = document.getElementById("noteBody");
  if (!body) return;
  
  const newDiv = document.createElement("div");
  newDiv.className = "sp-" + type;
  newDiv.innerHTML = "<br>";
  
  const sel = window.getSelection();
  let inserted = false;
  if (sel && sel.rangeCount > 0) {
    const node = sel.anchorNode;
    const parentEl = node.nodeType === 3 ? node.parentElement : node;
    let topEl = parentEl;
    while (topEl && topEl.parentElement !== body) {
      topEl = topEl.parentElement;
    }
    if (topEl && topEl.parentElement === body) {
      topEl.after(newDiv);
      inserted = true;
    }
  }
  
  if (!inserted) {
    body.appendChild(newDiv);
  }
  
  // Move cursor into the new div
  const range = document.createRange();
  range.setStart(newDiv, 0);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
  
  onNoteBodyInput();
  spUpdateUI(type);
}

// === LIVE CONTENT POLLING (every 3 seconds for active note) ===

// Generate inline-styled HTML for screenplay (used by copy and print)
function getScreenplayHTML(title) {
  const body = document.getElementById("noteBody");
  if (!body) return "";
  
  const pageCSS = `
    @page { size: letter; margin: 1in 1in 1in 1.5in; }
    body { font-family: "Courier New", Courier, monospace; font-size: 12pt; line-height: 1.0; color: #000; max-width: 6in; margin: 0 auto; }
    h1 { font-size: 14pt; text-align: center; margin-bottom: 24pt; font-weight: normal; text-transform: uppercase; }
    .sp-action { display: block; text-align: left; margin: 12pt 0; padding: 0; }
    .sp-character { display: block; text-align: left; text-transform: uppercase; margin: 12pt 0 0 0; padding-left: 2.2in; }
    .sp-dialogue { display: block; margin: 0 0 12pt 0; padding-left: 1in; padding-right: 1in; }
    .sp-paren { display: block; margin: 0; padding-left: 1.4in; padding-right: 1.4in; font-style: italic; }
    .sp-center { display: block; text-align: center; margin: 12pt 0; }
    .sp-transition { display: block; text-align: right; text-transform: uppercase; margin: 12pt 0; }
  `;
  
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + pageCSS + '</style></head><body><h1>' + esc(title) + '</h1>' + body.innerHTML + '</body></html>';
}

function copyScreenplayFormatted() {
  const note = getActiveNote();
  const title = note ? note.title : "Untitled";
  const html = getScreenplayHTML(title);
  
  const body = document.getElementById("noteBody");
  const plainText = body ? body.innerText : "";
  
  try {
    const blob = new Blob([html], { type: "text/html" });
    const textBlob = new Blob([plainText], { type: "text/plain" });
    const item = new ClipboardItem({
      "text/html": blob,
      "text/plain": textBlob
    });
    navigator.clipboard.write([item]).then(() => {
      setSaveDot("#5a7a4a");
      hideSaveDot();
    });
  } catch(e) {
    navigator.clipboard.writeText(plainText).catch(() => {
      const ta = document.createElement("textarea");
      ta.value = plainText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    });
  }
}

function printScreenplay() {
  const note = getActiveNote();
  const title = note ? note.title : "Untitled";
  const html = getScreenplayHTML(title);
  
  const printWindow = window.open("", "_blank");
  if (!printWindow) { alert("Please allow popups to print."); return; }
  printWindow.document.write(html);
  printWindow.document.close();
  setTimeout(() => { printWindow.print(); }, 300);
}

// === LIVE CONTENT POLLING ===
let lastLocalContentHash = "";
let livePollingInterval = null;

function simpleHash(str) {
  if (!str) return "0";
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + c;
    hash |= 0;
  }
  return hash.toString();
}

function startLivePolling() {
  if (livePollingInterval) clearInterval(livePollingInterval);
  livePollingInterval = setInterval(async () => {
    // Only poll if we're on notes view, have an active note, and NOT currently typing
    if (state.view !== "notes" || !state.activePath || state.activePath.length === 0) return;
    const body = document.getElementById("noteBody");
    const isTyping = body && document.activeElement === body;
    if (isTyping) return; // Don't poll while typing
    
    // Check if we have pending saves
    const activeId = state.activePath[state.activePath.length - 1];
    if (contentSaveTimers[activeId]) return; // Don't poll while save is pending
    
    // Fetch latest content from Google Doc
    const result = await apiCall("action=getNoteContent&noteId=" + activeId);
    if (result.error || result.content === undefined) return;
    
    // Compare with local — only update if server has different content
    const serverHash = simpleHash(result.content);
    const localHash = lastLocalContentHash || simpleHash(body ? body.innerHTML : "");
    
    if (serverHash !== localHash) {
      // Server has newer content — update local
      const note = state.notesFlat.find(n => n.id === activeId);
      if (note) {
        note.content = result.content;
        lastLocalContentHash = serverHash;
        // Update the editor directly without full re-render (preserves cursor)
        if (body && document.activeElement !== body) {
          body.innerHTML = result.content;
        }
      }
    }
  }, 3000);
}

function stopLivePolling() {
  if (livePollingInterval) { clearInterval(livePollingInterval); livePollingInterval = null; }
}

// === URL HASH ROUTING ===
function updateHash() {
  if (state.view === "notes" && state.activePath && state.activePath.length > 0) {
    window.location.hash = "note/" + state.activePath.join("/");
  } else if (state.view === "tasks") {
    window.location.hash = "tasks";
  } else if (state.view === "notes") {
    window.location.hash = "notes";
  }
}

function readHash() {
  const hash = window.location.hash.replace("#", "");
  if (!hash) return;
  const parts = hash.split("/");
  if (parts[0] === "tasks") {
    state.view = "tasks";
  } else if (parts[0] === "note" && parts.length > 1) {
    state.view = "notes";
    state.activePath = parts.slice(1);
    // Auto-expand all ancestors
    for (let i = 0; i < state.activePath.length; i++) {
      expandedNodes[state.activePath[i]] = true;
    }
  } else if (parts[0] === "notes") {
    state.view = "notes";
  }
}

function navigateToNote(pathArr) {
  state.activePath = pathArr;
  state.view = "notes";
  state.sidebarOpen = false;
  lastLocalContentHash = "";
  
  // Restore screenplay mode from the note's saved mode
  if (pathArr && pathArr.length > 0) {
    const noteId = pathArr[pathArr.length - 1];
    const note = state.notesFlat.find(n => n.id === noteId);
    state.screenplayMode = (note && note.mode === "screenplay");
    state.spCurrentFormat = "action";
  }
  
  updateHash();
  render();
  if (pathArr && pathArr.length > 0) {
    const noteId = pathArr[pathArr.length - 1];
    const note = state.notesFlat.find(n => n.id === noteId);
    if (note && note.content === undefined) {
      loadNoteContent(noteId);
    } else if (note) {
      lastLocalContentHash = simpleHash(note.content || "");
    }
    startLivePolling();
  }
}

function copyNoteLink(pathArr, btnEl) {
  const url = window.location.origin + window.location.pathname + "#note/" + pathArr.join("/");
  navigator.clipboard.writeText(url).then(() => {
    if (btnEl) { btnEl.textContent = "✓"; btnEl.classList.add("ns-link-copied"); setTimeout(() => { btnEl.textContent = "🔗"; btnEl.classList.remove("ns-link-copied"); }, 1500); }
  }).catch(() => {
    const ta = document.createElement("textarea"); ta.value = url; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    if (btnEl) { btnEl.textContent = "✓"; setTimeout(() => { btnEl.textContent = "🔗"; }, 1500); }
  });
}

window.addEventListener("hashchange", () => { readHash(); render(); });

// === INIT ===
async function init() {
  await loadAll();
  readHash();
  
  if (state.view === "notes") {
    await loadNotesLite();
    if (state.activePath && state.activePath.length > 0) {
      const noteId = state.activePath[state.activePath.length - 1];
      const note = state.notesFlat.find(n => n.id === noteId);
      state.screenplayMode = (note && note.mode === "screenplay");
      state.spCurrentFormat = "action";
      await loadNoteContent(noteId);
      startLivePolling();
    }
  }
  
  render();
  
  // Background sync for tasks/structure every 15 seconds (not note content — that's handled by live polling)
  setInterval(() => {
    const body = document.getElementById("noteBody");
    const isTyping = body && document.activeElement === body;
    if (!isTyping) {
      bgSync();
    }
  }, 15000);
}
init();
